<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AllChat — Multi-Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: oklch(98% 0.005 80);
    --bg2: oklch(96% 0.006 80);
    --bg3: oklch(93% 0.007 80);
    --border: oklch(88% 0.008 80);
    --text: oklch(14% 0.01 260);
    --text2: oklch(44% 0.01 260);
    --text3: oklch(64% 0.01 260);
    --accent: oklch(52% 0.14 252);
    --accent-light: oklch(94% 0.04 252);
    --agent-a: oklch(52% 0.14 252);
    --agent-b: oklch(52% 0.14 170);
    --agent-c: oklch(52% 0.14 30);
    --sidebar-w: 240px;
    --stats-w: 260px;
  }
  [data-theme="dark"] {
    --bg: oklch(13% 0.008 260);
    --bg2: oklch(17% 0.009 260);
    --bg3: oklch(21% 0.01 260);
    --border: oklch(26% 0.01 260);
    --text: oklch(94% 0.006 80);
    --text2: oklch(66% 0.008 260);
    --text3: oklch(48% 0.008 260);
    --accent: oklch(62% 0.14 252);
    --accent-light: oklch(22% 0.06 252);
    --agent-a: oklch(62% 0.14 252);
    --agent-b: oklch(62% 0.14 170);
    --agent-c: oklch(62% 0.14 30);
  }
  html, body, #root { height: 100%; width: 100%; overflow: hidden; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ─── Data ────────────────────────────────────────────────────────────────────

const MODELS = [
  { id: 'gpt-4o', label: 'GPT-4o', color: 'var(--agent-a)', provider: 'OpenAI' },
  { id: 'claude-3-5', label: 'Claude 3.5 Sonnet', color: 'var(--agent-b)', provider: 'Anthropic' },
  { id: 'gemini-1-5', label: 'Gemini 1.5 Pro', color: 'var(--agent-c)', provider: 'Google' },
  { id: 'multi', label: 'All Agents', color: 'var(--text2)', provider: 'Multi' },
];

const HISTORY = [
  { id: 'c1', title: 'Compare agent reasoning styles', time: 'Today', active: true },
  { id: 'c2', title: 'Draft quarterly review email', time: 'Today', active: false },
  { id: 'c3', title: 'Debug async race condition', time: 'Yesterday', active: false },
  { id: 'c4', title: 'Summarize research paper', time: 'Yesterday', active: false },
  { id: 'c5', title: 'Plan team offsite agenda', time: 'Wed', active: false },
  { id: 'c6', title: 'Write unit tests for auth module', time: 'Tue', active: false },
  { id: 'c7', title: 'Explain transformer attention', time: 'Mon', active: false },
];

const INITIAL_MESSAGES = [
  {
    id: 'm1', role: 'user',
    content: 'Can you explain how multi-agent systems differ from single-agent LLM setups?',
    ts: '10:04 AM',
  },
  {
    id: 'm2', role: 'agent', model: 'gpt-4o',
    content: 'Multi-agent systems distribute tasks across multiple specialized models running in parallel or in sequence — each agent handles a subtask it\'s optimized for. This contrasts with single-agent setups where one model handles everything sequentially, often hitting context limits or making trade-offs between breadth and depth.',
    ts: '10:04 AM', tokens: 312, cost: 0.0047,
  },
  {
    id: 'm3', role: 'agent', model: 'claude-3-5',
    content: 'The key difference is **coordination overhead vs. specialization gains**. Single agents are simpler — one context, one call. Multi-agent architectures introduce orchestration complexity but unlock parallelism, fault isolation, and the ability to use cheaper models for lighter subtasks while reserving expensive ones for reasoning-heavy steps.',
    ts: '10:04 AM', tokens: 287, cost: 0.0038,
  },
  {
    id: 'm4', role: 'user',
    content: 'What are the biggest failure modes to watch out for?',
    ts: '10:06 AM',
  },
  {
    id: 'm5', role: 'agent', model: 'gpt-4o',
    content: 'Three main failure modes: **1) Context drift** — agents diverge in understanding without a shared memory layer. **2) Cascading errors** — one agent\'s bad output poisons downstream agents. **3) Infinite loops** — agents waiting on each other with no deadlock detection.',
    ts: '10:06 AM', tokens: 198, cost: 0.0031,
  },
  {
    id: 'm6', role: 'agent', model: 'gemini-1-5',
    content: 'I\'d add **cost explosion** as a critical one — multi-agent runs can quietly balloon token usage 10-50× over a single-agent call if you\'re not tracking per-agent budgets. Observability is often an afterthought, making it hard to audit what each agent actually did.',
    ts: '10:07 AM', tokens: 241, cost: 0.0029,
  },
];

// ─── Icons ────────────────────────────────────────────────────────────────────

const Icon = ({ name, size = 16, style }) => {
  const icons = {
    plus: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg>,
    search: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>,
    chevronLeft: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><polyline points="10,3 5,8 10,13"/></svg>,
    chevronRight: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><polyline points="6,3 11,8 6,13"/></svg>,
    send: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><line x1="14" y1="2" x2="1" y2="8"/><line x1="14" y1="2" x2="6" y2="14"/><line x1="6" y1="14" x2="1" y2="8"/></svg>,
    user: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="8" cy="5.5" r="3"/><path d="M2 14c0-3.31 2.69-5 6-5s6 1.69 6 5"/></svg>,
    zap: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><polygon points="9,1 3,9 8,9 7,15 13,7 8,7"/></svg>,
    barChart: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="1" y="9" width="3" height="6"/><rect x="6.5" y="5" width="3" height="10"/><rect x="12" y="1" width="3" height="14"/></svg>,
    cpu: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3" y="3" width="10" height="10" rx="1"/><line x1="6" y1="1" x2="6" y2="3"/><line x1="10" y1="1" x2="10" y2="3"/><line x1="6" y1="13" x2="6" y2="15"/><line x1="10" y1="13" x2="10" y2="15"/><line x1="1" y1="6" x2="3" y2="6"/><line x1="1" y1="10" x2="3" y2="10"/><line x1="13" y1="6" x2="15" y2="6"/><line x1="13" y1="10" x2="15" y2="10"/></svg>,
    dollarSign: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><line x1="8" y1="1" x2="8" y2="15"/><path d="M11 4H6.5a2.5 2.5 0 000 5h3a2.5 2.5 0 010 5H4"/></svg>,
    clock: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="8" cy="8" r="6.5"/><polyline points="8,4 8,8 11,10"/></svg>,
    settings: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M2.93 2.93l1.41 1.41M11.66 11.66l1.41 1.41M2.93 13.07l1.41-1.41M11.66 4.34l1.41-1.41"/></svg>,
    trash: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><polyline points="2,4 14,4"/><path d="M5 4V2h6v2"/><rect x="3" y="4" width="10" height="11" rx="1"/></svg>,
    layers: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><polygon points="8,1 15,5 8,9 1,5"/><polyline points="1,9 8,13 15,9"/></svg>,
    moon: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M13.5 10A6 6 0 016 2.5a6 6 0 100 11 6 6 0 007.5-3.5z"/></svg>,
    sun: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="8" cy="8" r="3"/><line x1="8" y1="1" x2="8" y2="3"/><line x1="8" y1="13" x2="8" y2="15"/><line x1="1" y1="8" x2="3" y2="8"/><line x1="13" y1="8" x2="15" y2="8"/><line x1="3.05" y1="3.05" x2="4.46" y2="4.46"/><line x1="11.54" y1="11.54" x2="12.95" y2="12.95"/><line x1="12.95" y1="3.05" x2="11.54" y2="4.46"/><line x1="4.46" y1="11.54" x2="3.05" y2="12.95"/></svg>,
    chevronDown: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><polyline points="3,6 8,11 13,6"/></svg>,
  };
  return <span style={{ display:'inline-flex', alignItems:'center', ...style }}>{icons[name] || null}</span>;
};

// ─── Agent Avatar ─────────────────────────────────────────────────────────────

const AgentAvatar = ({ model, size = 28 }) => {
  const m = MODELS.find(x => x.id === model);
  const initials = { 'gpt-4o': 'G4', 'claude-3-5': 'C', 'gemini-1-5': 'Gm' };
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%',
      background: m?.color || 'var(--text3)',
      color: '#fff', fontSize: size * 0.36,
      fontFamily: 'DM Mono, monospace',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      flexShrink: 0, fontWeight: 500,
    }}>
      {initials[model] || '?'}
    </div>
  );
};

// ─── Message Bubble ───────────────────────────────────────────────────────────

const renderMarkdown = (text) => {
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return parts.map((p, i) =>
    p.startsWith('**') && p.endsWith('**')
      ? <strong key={i}>{p.slice(2, -2)}</strong>
      : p
  );
};

const MessageBubble = ({ msg }) => {
  const isUser = msg.role === 'user';
  const model = MODELS.find(m => m.id === msg.model);

  if (isUser) return (
    <div style={{ display:'flex', justifyContent:'flex-end', marginBottom:20 }}>
      <div style={{
        maxWidth:'62%',
        background: 'var(--accent)',
        color: '#fff',
        borderRadius: '18px 18px 4px 18px',
        padding: '10px 15px',
        fontSize: 14, lineHeight: 1.6,
      }}>
        {msg.content}
      </div>
    </div>
  );

  return (
    <div style={{ display:'flex', gap:10, marginBottom:20, alignItems:'flex-start' }}>
      <AgentAvatar model={msg.model} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:4 }}>
          <span style={{ fontSize:12, fontWeight:600, color: model?.color || 'var(--text2)', fontFamily:'DM Mono,monospace' }}>
            {model?.label || msg.model}
          </span>
          <span style={{ fontSize:11, color:'var(--text3)' }}>{msg.ts}</span>
        </div>
        <div style={{
          background:'var(--bg2)',
          borderRadius:'4px 18px 18px 18px',
          padding:'10px 15px',
          fontSize:14, lineHeight:1.65, color:'var(--text)',
        }}>
          {renderMarkdown(msg.content)}
        </div>
        {msg.tokens && (
          <div style={{ display:'flex', gap:12, marginTop:5, fontSize:11, color:'var(--text3)', fontFamily:'DM Mono,monospace' }}>
            <span>{msg.tokens} tok</span>
            <span>${msg.cost.toFixed(4)}</span>
          </div>
        )}
      </div>
    </div>
  );
};

// ─── Left Sidebar ─────────────────────────────────────────────────────────────

const LeftSidebar = ({ open, onToggle, chats, activeChat, onSelectChat }) => {
  const [search, setSearch] = useState('');
  const filtered = chats.filter(c => c.title.toLowerCase().includes(search.toLowerCase()));
  const grouped = { Today: [], Yesterday: [], Earlier: [] };
  filtered.forEach(c => {
    if (c.time === 'Today') grouped.Today.push(c);
    else if (c.time === 'Yesterday') grouped.Yesterday.push(c);
    else grouped.Earlier.push(c);
  });

  return (
    <div style={{
      width: open ? 'var(--sidebar-w)' : 0,
      minWidth: open ? 'var(--sidebar-w)' : 0,
      transition: 'width 0.22s cubic-bezier(.4,0,.2,1), min-width 0.22s cubic-bezier(.4,0,.2,1)',
      overflow: 'hidden',
      display: 'flex', flexDirection: 'column',
      borderRight: '1px solid var(--border)',
      background: 'var(--bg)',
      height: '100%',
    }}>
      <div style={{ width:'var(--sidebar-w)', display:'flex', flexDirection:'column', height:'100%' }}>
        {/* Header */}
        <div style={{ padding:'16px 14px 10px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <span style={{ fontWeight:600, fontSize:15, letterSpacing:'-0.02em' }}>AllChat</span>
          <button onClick={onToggle} style={btnStyle} title="Collapse">
            <Icon name="chevronLeft" size={15}/>
          </button>
        </div>

        {/* New chat */}
        <div style={{ padding:'0 10px 10px' }}>
          <button style={{
            width:'100%', display:'flex', alignItems:'center', gap:8,
            padding:'8px 10px', borderRadius:8,
            background:'var(--accent)', color:'#fff',
            border:'none', cursor:'pointer', fontSize:13, fontWeight:500,
          }}>
            <Icon name="plus" size={14}/> New chat
          </button>
        </div>

        {/* Search */}
        <div style={{ padding:'0 10px 8px', position:'relative' }}>
          <Icon name="search" size={13} style={{ position:'absolute', left:20, top:'50%', transform:'translateY(-50%)', color:'var(--text3)' }}/>
          <input
            value={search} onChange={e => setSearch(e.target.value)}
            placeholder="Search chats…"
            style={{
              width:'100%', padding:'7px 10px 7px 30px',
              borderRadius:7, border:'1px solid var(--border)',
              background:'var(--bg2)', fontSize:13,
              color:'var(--text)', outline:'none', fontFamily:'inherit',
            }}
          />
        </div>

        {/* History */}
        <div style={{ flex:1, overflowY:'auto', padding:'0 6px' }}>
          {Object.entries(grouped).map(([group, items]) => items.length > 0 && (
            <div key={group}>
              <div style={{ padding:'8px 8px 4px', fontSize:11, fontWeight:600, color:'var(--text3)', textTransform:'uppercase', letterSpacing:'0.06em' }}>
                {group}
              </div>
              {items.map(chat => (
                <button key={chat.id} onClick={() => onSelectChat(chat.id)} style={{
                  width:'100%', display:'block', textAlign:'left',
                  padding:'7px 10px', borderRadius:7, border:'none', cursor:'pointer',
                  background: chat.id === activeChat ? 'var(--accent-light)' : 'transparent',
                  color: chat.id === activeChat ? 'var(--accent)' : 'var(--text)',
                  fontSize:13, fontWeight: chat.id === activeChat ? 500 : 400,
                  marginBottom:1, transition:'background 0.1s',
                  whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',
                }}>
                  {chat.title}
                </button>
              ))}
            </div>
          ))}
        </div>

        {/* User banner */}
        <div style={{ padding:'10px 12px 14px', borderTop:'1px solid var(--border)', display:'flex', alignItems:'center', gap:9 }}>
          <div style={{
            width:30, height:30, borderRadius:'50%',
            background:'var(--bg3)', display:'flex', alignItems:'center', justifyContent:'center',
            color:'var(--text2)',
          }}>
            <Icon name="user" size={15}/>
          </div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:13, fontWeight:500, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>Alex Chen</div>
            <div style={{ fontSize:11, color:'var(--text3)' }}>Pro plan</div>
          </div>
          <button style={btnStyle} title="Settings"><Icon name="settings" size={14}/></button>
        </div>
      </div>
    </div>
  );
};

// ─── Right Sidebar ────────────────────────────────────────────────────────────

const StatRow = ({ label, value, sub, accent }) => (
  <div style={{ display:'flex', flexDirection:'column', padding:'10px 0', borderBottom:'1px solid var(--border)' }}>
    <div style={{ fontSize:11, color:'var(--text3)', marginBottom:3, textTransform:'uppercase', letterSpacing:'0.05em', fontWeight:600 }}>{label}</div>
    <div style={{ fontSize:20, fontWeight:600, fontFamily:'DM Mono,monospace', color: accent || 'var(--text)', letterSpacing:'-0.03em' }}>{value}</div>
    {sub && <div style={{ fontSize:11, color:'var(--text3)', marginTop:1 }}>{sub}</div>}
  </div>
);

const RightSidebar = ({ open, onToggle, messages }) => {
  const agentMsgs = messages.filter(m => m.role === 'agent');
  const totalTokens = agentMsgs.reduce((s, m) => s + (m.tokens || 0), 0);
  const totalCost = agentMsgs.reduce((s, m) => s + (m.cost || 0), 0);
  const usedModels = [...new Set(agentMsgs.map(m => m.model))];
  const turns = agentMsgs.length;

  const modelBreakdown = usedModels.map(mid => {
    const msgs = agentMsgs.filter(m => m.model === mid);
    const tok = msgs.reduce((s, m) => s + (m.tokens || 0), 0);
    const cost = msgs.reduce((s, m) => s + (m.cost || 0), 0);
    const model = MODELS.find(x => x.id === mid);
    return { mid, label: model?.label, color: model?.color, tok, cost };
  });

  return (
    <div style={{
      width: open ? 'var(--stats-w)' : 0,
      minWidth: open ? 'var(--stats-w)' : 0,
      transition: 'width 0.22s cubic-bezier(.4,0,.2,1), min-width 0.22s cubic-bezier(.4,0,.2,1)',
      overflow: 'hidden',
      borderLeft: '1px solid var(--border)',
      background: 'var(--bg)',
      height: '100%',
      display: 'flex', flexDirection:'column',
    }}>
      <div style={{ width:'var(--stats-w)', display:'flex', flexDirection:'column', height:'100%' }}>
        {/* Header */}
        <div style={{ padding:'16px 14px 12px', display:'flex', alignItems:'center', gap:8, borderBottom:'1px solid var(--border)' }}>
          <button onClick={onToggle} style={btnStyle} title="Collapse"><Icon name="chevronRight" size={15}/></button>
          <span style={{ fontWeight:600, fontSize:13 }}>Session Stats</span>
        </div>

        <div style={{ flex:1, overflowY:'auto', padding:'0 16px' }}>
          <StatRow label="Total Tokens" value={totalTokens.toLocaleString()} sub={`${turns} agent responses`} />
          <StatRow label="Estimated Cost" value={`$${totalCost.toFixed(4)}`} sub="This session" accent="var(--agent-b)" />
          <StatRow label="Agents Active" value={usedModels.length} sub="Models engaged" />

          {/* Per-model breakdown */}
          <div style={{ paddingTop:14 }}>
            <div style={{ fontSize:11, color:'var(--text3)', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:8 }}>Per-model</div>
            {modelBreakdown.map(m => (
              <div key={m.mid} style={{ marginBottom:10 }}>
                <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:4 }}>
                  <div style={{ width:8, height:8, borderRadius:'50%', background:m.color, flexShrink:0 }}></div>
                  <span style={{ fontSize:12, fontWeight:500, color:'var(--text)', flex:1, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{m.label}</span>
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:4 }}>
                  <div style={{ background:'var(--bg2)', borderRadius:6, padding:'5px 8px' }}>
                    <div style={{ fontSize:10, color:'var(--text3)' }}>Tokens</div>
                    <div style={{ fontSize:13, fontFamily:'DM Mono,monospace', fontWeight:500 }}>{m.tok.toLocaleString()}</div>
                  </div>
                  <div style={{ background:'var(--bg2)', borderRadius:6, padding:'5px 8px' }}>
                    <div style={{ fontSize:10, color:'var(--text3)' }}>Cost</div>
                    <div style={{ fontSize:13, fontFamily:'DM Mono,monospace', fontWeight:500 }}>${m.cost.toFixed(4)}</div>
                  </div>
                </div>
                {/* Token bar */}
                <div style={{ marginTop:5, height:3, background:'var(--bg3)', borderRadius:2 }}>
                  <div style={{ width:`${(m.tok/totalTokens*100).toFixed(1)}%`, height:'100%', background:m.color, borderRadius:2, transition:'width 0.4s' }}></div>
                </div>
              </div>
            ))}
          </div>

          {/* Latency */}
          <div style={{ paddingTop:4 }}>
            <div style={{ fontSize:11, color:'var(--text3)', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:8 }}>Latency</div>
            {[{label:'GPT-4o', ms:1240, color:'var(--agent-a)'},{label:'Claude 3.5', ms:980, color:'var(--agent-b)'},{label:'Gemini 1.5', ms:1580, color:'var(--agent-c)'}].map(l => (
              <div key={l.label} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6 }}>
                <span style={{ fontSize:11, color:'var(--text2)', width:68, flexShrink:0 }}>{l.label}</span>
                <div style={{ flex:1, height:3, background:'var(--bg3)', borderRadius:2 }}>
                  <div style={{ width:`${l.ms/2000*100}%`, height:'100%', background:l.color, borderRadius:2 }}></div>
                </div>
                <span style={{ fontSize:11, fontFamily:'DM Mono,monospace', color:'var(--text3)', width:38, textAlign:'right' }}>{l.ms}ms</span>
              </div>
            ))}
          </div>
        </div>

        {/* Footer */}
        <div style={{ padding:'10px 16px 14px', borderTop:'1px solid var(--border)' }}>
          <button style={{
            width:'100%', padding:'7px 10px', borderRadius:7,
            border:'1px solid var(--border)', background:'transparent',
            fontSize:12, color:'var(--text2)', cursor:'pointer',
            display:'flex', alignItems:'center', justifyContent:'center', gap:6,
          }}>
            <Icon name="trash" size={13}/>
            Clear session data
          </button>
        </div>
      </div>
    </div>
  );
};

// ─── Model Selector ───────────────────────────────────────────────────────────

const ModelSelector = ({ selected, onChange }) => {
  const [open, setOpen] = useState(false);
  const model = MODELS.find(m => m.id === selected);
  const ref = useRef();

  useEffect(() => {
    const handler = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  return (
    <div ref={ref} style={{ position:'relative' }}>
      <button onClick={() => setOpen(o => !o)} style={{
        display:'flex', alignItems:'center', gap:6,
        padding:'5px 10px', borderRadius:7,
        border:'1px solid var(--border)', background:'var(--bg2)',
        cursor:'pointer', fontSize:12, color:'var(--text)', fontFamily:'inherit',
      }}>
        <div style={{ width:8, height:8, borderRadius:'50%', background:model?.color }}></div>
        <span>{model?.label}</span>
        <Icon name="chevronDown" size={12} style={{ color:'var(--text3)' }}/>
      </button>
      {open && (
        <div style={{
          position:'absolute', bottom:'calc(100% + 6px)', left:0,
          background:'var(--bg)', border:'1px solid var(--border)',
          borderRadius:10, padding:5, boxShadow:'0 8px 24px rgba(0,0,0,0.1)',
          zIndex:100, minWidth:200,
        }}>
          {MODELS.map(m => (
            <button key={m.id} onClick={() => { onChange(m.id); setOpen(false); }} style={{
              width:'100%', display:'flex', alignItems:'center', gap:8,
              padding:'7px 10px', border:'none', borderRadius:7,
              background: m.id === selected ? 'var(--accent-light)' : 'transparent',
              color: m.id === selected ? 'var(--accent)' : 'var(--text)',
              cursor:'pointer', textAlign:'left', fontSize:13, fontFamily:'inherit',
            }}>
              <div style={{ width:8, height:8, borderRadius:'50%', background:m.color, flexShrink:0 }}></div>
              <div>
                <div style={{ fontWeight:500 }}>{m.label}</div>
                <div style={{ fontSize:11, color:'var(--text3)' }}>{m.provider}</div>
              </div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
};

// ─── Main App ─────────────────────────────────────────────────────────────────

const btnStyle = {
  display:'inline-flex', alignItems:'center', justifyContent:'center',
  width:28, height:28, borderRadius:7,
  border:'none', background:'transparent', cursor:'pointer',
  color:'var(--text2)', transition:'background 0.1s',
};

const TYPING_RESPONSES = {
  'gpt-4o': "That's a great follow-up. To summarize the key architecture patterns: **orchestrator-worker** (one agent coordinates), **peer-to-peer** (agents communicate directly), and **hierarchical** (nested coordination layers). Each trades off control, parallelism, and complexity differently.",
  'claude-3-5': "One underrated aspect is **trust boundaries** between agents. In open multi-agent systems, you can't assume a calling agent is benign — prompt injection can propagate through agent calls. Sandboxing each agent's tool access is essential for production systems.",
  'gemini-1-5': "From an infrastructure perspective, the biggest unlock is **asynchronous execution** — letting agents work in parallel rather than sequentially. A well-designed async multi-agent system can reduce end-to-end latency by 60-80% compared to serial chains.",
};

function App() {
  const [dark, setDark] = useState(() => localStorage.getItem('allchat-dark') === 'true');
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    localStorage.setItem('allchat-dark', dark);
  }, [dark]);

  const [leftOpen, setLeftOpen] = useState(true);
  const [rightOpen, setRightOpen] = useState(true);
  const [messages, setMessages] = useState(INITIAL_MESSAGES);
  const [activeChat, setActiveChat] = useState('c1');
  const [input, setInput] = useState('');
  const [selectedModel, setSelectedModel] = useState('multi');
  const [typing, setTyping] = useState(null); // model id currently typing
  const [chats, setChats] = useState(HISTORY);
  const bottomRef = useRef();
  const textareaRef = useRef();

  const scrollToBottom = () => {
    if (bottomRef.current) {
      bottomRef.current.parentElement.scrollTop = bottomRef.current.offsetTop;
    }
  };

  useEffect(() => { scrollToBottom(); }, [messages, typing]);

  const handleSend = useCallback(() => {
    const text = input.trim();
    if (!text) return;
    setInput('');
    const userMsg = { id: 'm' + Date.now(), role:'user', content:text, ts: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) };
    setMessages(prev => [...prev, userMsg]);

    // Simulate agent response(s)
    const respondingModels = selectedModel === 'multi'
      ? ['gpt-4o', 'claude-3-5', 'gemini-1-5']
      : [selectedModel];

    respondingModels.forEach((mid, i) => {
      setTimeout(() => {
        setTyping(mid);
        setTimeout(() => {
          setTyping(null);
          const toks = Math.floor(Math.random() * 200) + 120;
          const cost = toks * 0.000015;
          setMessages(prev => [...prev, {
            id: 'm' + Date.now() + mid,
            role: 'agent', model: mid,
            content: TYPING_RESPONSES[mid] || "I'm processing your request.",
            ts: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),
            tokens: toks, cost,
          }]);
        }, 1400 + Math.random() * 600);
      }, i * 900);
    });
  }, [input, selectedModel]);

  const handleKeyDown = e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
  };

  const autoResize = e => {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';
  };

  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden', background:'var(--bg)' }}>

      {/* Left Sidebar */}
      <LeftSidebar
        open={leftOpen}
        onToggle={() => setLeftOpen(o => !o)}
        chats={chats}
        activeChat={activeChat}
        onSelectChat={setActiveChat}
      />

      {/* Main */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', minWidth:0, position:'relative' }}>

        {/* Top bar */}
        <div style={{
          display:'flex', alignItems:'center', gap:8, padding:'12px 16px',
          borderBottom:'1px solid var(--border)', background:'var(--bg)',
          flexShrink:0,
        }}>
          {!leftOpen && (
            <button onClick={() => setLeftOpen(true)} style={btnStyle} title="Expand sidebar">
              <Icon name="chevronRight" size={15}/>
            </button>
          )}
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontWeight:600, fontSize:14, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
              {chats.find(c => c.id === activeChat)?.title}
            </div>
            <div style={{ fontSize:11, color:'var(--text3)', display:'flex', alignItems:'center', gap:4 }}>
              <Icon name="layers" size={10}/> Multi-agent · 3 models
            </div>
          </div>
          <button onClick={() => setDark(d => !d)} style={btnStyle} title={dark ? 'Light mode' : 'Dark mode'}>
            <Icon name={dark ? 'sun' : 'moon'} size={15}/>
          </button>
          {!rightOpen && (
            <button onClick={() => setRightOpen(true)} style={btnStyle} title="Show stats">
              <Icon name="barChart" size={15}/>
            </button>
          )}
        </div>

        {/* Messages */}
        <div style={{ flex:1, overflowY:'auto', padding:'24px 32px' }}>
          {messages.map(msg => <MessageBubble key={msg.id} msg={msg} />)}

          {/* Typing indicator */}
          {typing && (
            <div style={{ display:'flex', gap:10, marginBottom:20, alignItems:'flex-start' }}>
              <AgentAvatar model={typing} />
              <div style={{ background:'var(--bg2)', borderRadius:'4px 18px 18px 18px', padding:'12px 16px' }}>
                <div style={{ display:'flex', gap:4 }}>
                  {[0,1,2].map(i => (
                    <div key={i} style={{
                      width:6, height:6, borderRadius:'50%',
                      background:'var(--text3)',
                      animation:`bounce 1.2s ${i*0.2}s infinite`,
                    }}/>
                  ))}
                </div>
              </div>
            </div>
          )}
          <div ref={bottomRef}/>
        </div>

        {/* Input */}
        <div style={{ padding:'12px 24px 18px', borderTop:'1px solid var(--border)', background:'var(--bg)', flexShrink:0 }}>
          <div style={{
            border:'1px solid var(--border)', borderRadius:14,
            background:'var(--bg)',
            boxShadow:'0 2px 12px rgba(0,0,0,0.06)',
            transition:'box-shadow 0.15s',
          }}>
            <textarea
              ref={textareaRef}
              value={input}
              onChange={e => { setInput(e.target.value); autoResize(e); }}
              onKeyDown={handleKeyDown}
              placeholder="Message all agents… (Shift+Enter for newline)"
              rows={1}
              style={{
                width:'100%', padding:'12px 16px 4px',
                border:'none', background:'transparent', resize:'none',
                fontFamily:'inherit', fontSize:14, color:'var(--text)',
                outline:'none', lineHeight:1.6,
              }}
            />
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'4px 12px 10px' }}>
              <ModelSelector selected={selectedModel} onChange={setSelectedModel} />
              <button
                onClick={handleSend}
                disabled={!input.trim()}
                style={{
                  display:'flex', alignItems:'center', gap:6,
                  padding:'7px 14px', borderRadius:8,
                  border:'none', background: input.trim() ? 'var(--accent)' : 'var(--bg3)',
                  color: input.trim() ? '#fff' : 'var(--text3)',
                  cursor: input.trim() ? 'pointer' : 'default',
                  fontSize:13, fontWeight:500, transition:'background 0.15s',
                }}
              >
                <Icon name="send" size={13}/> Send
              </button>
            </div>
          </div>
        </div>
      </div>

      {/* Right Sidebar */}
      <RightSidebar
        open={rightOpen}
        onToggle={() => setRightOpen(o => !o)}
        messages={messages}
      />

      <style>{`
        @keyframes bounce {
          0%, 60%, 100% { transform: translateY(0); }
          30% { transform: translateY(-5px); }
        }
        button:hover { background: var(--bg3) !important; }
        button[style*="var(--accent)"]:hover { background: oklch(48% 0.14 252) !important; }
        button[style*="var(--bg3)"]:hover { background: var(--bg3) !important; }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
