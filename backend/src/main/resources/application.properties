spring.application.name=model-selector-demo

spring.datasource.url=jdbc:postgresql://localhost:5432/nickchat
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.open-in-view=false

# Prevents Hibernate from creating or modifying the database schema.
# Validates that the schema matches the entity mappings.
# Recommended when Flyway fully manages schema changes.
spring.jpa.hibernate.ddl-auto=validate

# Logs all SQL statements executed by Hibernate.
# Useful for debugging and development visibility.
spring.jpa.show-sql=true

# Specifies the SQL dialect Hibernate should use.
# Ensures compatibility with PostgreSQL-specific SQL syntax.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Formats SQL queries in logs for better readability.
spring.jpa.properties.hibernate.format_sql=true

app.openai.key=${OPEN_AI_API_KEY}
app.anthropic.key=${ANTHROPIC_API_KEY}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/auth/callback/google
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

app.auth.frontend-origin=${APP_AUTH_FRONTEND_ORIGIN:http://localhost:3000}
app.auth.post-login-redirect=${APP_AUTH_POST_LOGIN_REDIRECT:${app.auth.frontend-origin}}

server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

logging.level.org.springframework.security=TRACE

# ----------------------------
# Flyway Configuration
# ----------------------------

# Enables Flyway database migrations at application startup.
# Explicit for clarity, even though the Flyway starter enables it by default.
spring.flyway.enabled=true

# Location where Flyway looks for migration scripts.
# By convention: src/main/resources/db/migration
spring.flyway.locations=classpath:db/migration